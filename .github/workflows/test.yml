name: Test

on:
  push:
    branches:
      - master
      - dev

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    container: golang:1.26-alpine

    steps:
      - uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        run: go test ./... -v
