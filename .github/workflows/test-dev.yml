name: Test Dev

on:
  push:
    branches:
      - dev

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    container: golang:1-alpine

    steps:
      - uses: actions/checkout@v2

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests
        run: go test ./... -v
